name: Project identity and source provenance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  identity-and-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check project identity and protect notices
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 enterprise/verify_project.py
