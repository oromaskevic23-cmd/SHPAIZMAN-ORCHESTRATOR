name: Brother Enterprise Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.12"
      - name: Verify archive validator unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Assert exactly ten unique authorized platform agents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("enterprise/handover-contract.json").read_text())
          agents=obj["platform_agents"]
          assert obj["schema"]=="shpaizman_enterprise_handover_v1"
          assert len(agents)==10
          assert len({a["id"] for a in agents})==10
          assert len({a["platform"] for a in agents})==10
          assert obj["beneficiary"]=="Alexander Viktorovich"
          assert obj["external_connections_verified"]==0
          assert obj["paid_services_allowed"] is False
          assert obj["income_verified"] is False
          assert obj["installation"]=="BROTHER_LOCAL_AUTHORIZED_ONLY"
          assert "AUTO_TRANSFER" in obj["deny"]
          print("PASS: ten allowlisted agents; brother-owned payouts; fail-closed consent")
          PY
      - name: Exercise offline Service Factory and pipeline integrity smoke
        run: |
          python -m shpaizman.business_cli catalog > /tmp/service-offers.json
          python -m shpaizman.business_cli --data-dir /tmp/shpaizman-ci-business dashboard > /tmp/service-dashboard.json
          python -m shpaizman.business_cli --data-dir /tmp/shpaizman-ci-business verify
          python - <<'PY'
          import json
          from pathlib import Path
          offers=json.loads(Path("/tmp/service-offers.json").read_text())
          dashboard=json.loads(Path("/tmp/service-dashboard.json").read_text())
          assert len(offers["offers"])==5
          assert len({agent for v in offers["offers"].values() for agent in v["agents"]})==10
          assert dashboard["verified_received_revenue_minor"]==0
          assert dashboard["automated_wallet_transfers"]=="DISABLED"
          assert dashboard["platform_accounts_connected"]==0
          print("PASS: real offline business executable, ten agents, zero fake revenue")
          PY
